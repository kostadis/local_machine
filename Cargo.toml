[package]
name = "local-machine"
version = "0.1.0"
edition = "2024"
description = "Tools for managing this machine"

[lib]
path = "src/lib.rs"

[[bin]]
name = "local-machine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ipnet = "2"
rpassword = "7"
serde_yaml_ng = "0.10"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
